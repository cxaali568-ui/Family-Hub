    <script>
      (function() {
        // Strictly bypass development HMR workarounds in production environments
        if (typeof window !== 'undefined' && window.location && window.location.hostname.includes('netlify.app')) {
          return;
        }

        // AI Studio environment disables HMR WebSockets.
        // Provide a silent stub for Vite's HMR transport so it avoids failing connection attempts.
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isHmr = (protocols === 'vite-hmr') ||
                        (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                        (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1));
            if (isHmr) {
              var listeners = {};
              var fakeWs = {
                url: url,
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                OPEN: 1, CLOSED: 3, CLOSING: 2, CONNECTING: 0,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                onopen: null, onclose: null, onerror: null, onmessage: null,
                addEventListener: function(event, fn) {
                  if (event === 'open') {
                    setTimeout(function() {
                      try {
                        if (typeof fakeWs.onopen === 'function') fakeWs.onopen({ type: 'open', target: fakeWs });
                        fn({ type: 'open', target: fakeWs });
                      } catch (e) {}
                    }, 0);
                  } else {
                    listeners[event] = listeners[event] || [];
                    listeners[event].push(fn);
                  }
                },
                removeEventListener: function(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() { fakeWs.readyState = 3; }
              };
              return fakeWs;
            }
            return new NativeWS(url, protocols);
          };
          window.WebSocket.prototype = NativeWS.prototype;
          window.WebSocket.CONNECTING = NativeWS.CONNECTING;
          window.WebSocket.OPEN = NativeWS.OPEN;
          window.WebSocket.CLOSING = NativeWS.CLOSING;
          window.WebSocket.CLOSED = NativeWS.CLOSED;
        }

        var isBenignViteWs = function(str) {
          if (!str || typeof str !== 'string') return false;
          return (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1) &&
                 (str.indexOf('closed without opened') !== -1 || str.indexOf('failed to connect') !== -1 || str.indexOf('connecting...') !== -1);
        };
        var origConsoleError = console.error;
        console.error = function() {
          if (arguments.length > 0) {
            for (var i = 0; i < arguments.length; i++) {
              var arg = arguments[i];
              var text = (arg && (arg.message || arg.stack || (typeof arg === 'string' ? arg : ''))) || '';
              if (isBenignViteWs(String(text))) {
                return;
              }
            }
          }
          return origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(event) {
          var text = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
          if (isBenignViteWs(String(text))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var text = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isBenignViteWs(String(text))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
